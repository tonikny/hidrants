services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hidrants-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
      - "51823:51823"
    expose:
      - "1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/certs:/mosquitto/certs:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - hidrants-net
    healthcheck:
      test: ["CMD", "pidof", "mosquitto"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 10s

  backend:
    image: hidrants-backend:latest
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: hidrants-back
    restart: unless-stopped
    ports:
      - "127.0.0.1:3034:3033"
    env_file:
      - ./back/.env
    volumes:
      - ./back/data:/app/data
    networks:
      - hidrants-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3033/api/adfs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: hidrants-frontend:latest
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: hidrants-front
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hidrants-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hidrants-net:
    driver: bridge
