# Configuració de desenvolupament - sense TLS
listener 1883

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Permet connexions sense autenticació en dev
allow_anonymous true

# Opcional: si vols mantenir autenticació en dev, descomenta:
# allow_anonymous false
# password_file /mosquitto/config/passwords
# acl_file /mosquitto/config/acl